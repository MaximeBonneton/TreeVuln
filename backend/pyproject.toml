[project]
name = "treevuln-backend"
version = "0.1.0"
description = "Backend for TreeVuln - SSVC Decision Tree Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "polars>=0.20.0",
    "alembic>=1.13.0",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<5",
    # Moteur regex avec timeout réel (interruption du backtracking
    # catastrophique), cf. _safe_regex_match dans app/engine/nodes.py
    "regex>=2024.5.15",
    # Signature OpenPGP des documents CSAF (Phase 1 CRA). python-gnupg
    # pilote le binaire gpg ; choisi contre PGPy (peu maintenu).
    "python-gnupg>=0.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    # Base PostgreSQL éphémère pour les tests d'intégration (fixture db_engine).
    # Non embarqué dans l'image runtime (deps runtime = requirements.lock).
    "testcontainers>=4.0.0",
    # Validation des documents CSAF générés contre le schéma JSON officiel
    "jsonschema>=4.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
